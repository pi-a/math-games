<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Chomp</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lora:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../shared/css/theme.css" />
<link rel="stylesheet" href="../../shared/css/base.css" />
<link rel="stylesheet" href="style.css" />
</head>
<body>

<div class="corner corner-top-left"><img class="corner-image" data-asset="corner-top-left" alt="" /></div>
<div class="corner corner-top-right"><img class="corner-image" data-asset="corner-top-right" alt="" /></div>
<div class="corner corner-bottom-left"><img class="corner-image" data-asset="corner-bottom-left" alt="" /></div>
<div class="corner corner-bottom-right"><img class="corner-image" data-asset="corner-bottom-right" alt="" /></div>

<main class="wrap">

  <section id="view-setup" class="view">
    <h1 class="title">Chomp</h1>
    <p class="tagline">Iss ein Feld und alles rechts unten davon. Iss nicht das vergiftete Feld.</p>

    <div class="rules">
      <p>Das Feld oben links ist vergiftet. Wenn du am Zug bist, klicke auf ein Feld, das noch da ist. Dieses Feld und alle Felder rechts unten davon werden gegessen.</p>
      <p>Wer am Ende das vergiftete Feld essen muss, verliert.</p>
    </div>

    <form id="setup-form" class="setup-form">
      <div class="field-row">
        <div class="field">
          <label for="player1-name">Spieler 1: Name oder Spitzname</label>
          <input type="text" id="player1-name" maxlength="20" autocomplete="off" />
        </div>
        <div class="field">
          <label for="player2-name">Spieler 2: Name oder Spitzname</label>
          <input type="text" id="player2-name" maxlength="20" autocomplete="off" />
        </div>
      </div>

      <div class="field">
        <label>Form des Spielfelds</label>
        <div class="shape-choice">
          <label class="shape-option">
            <input type="radio" name="shape" value="grid" checked />
            Rechteck
          </label>
          <label class="shape-option">
            <input type="radio" name="shape" value="staircase" />
            Treppe
          </label>
        </div>
      </div>

      <div class="field-row">
        <div class="field">
          <label for="rows-input">Zeilen: <span id="rows-display">4</span></label>
          <input type="range" id="rows-input" min="1" max="8" value="4" step="1" />
        </div>
        <div class="field">
          <label for="cols-input">Spalten: <span id="cols-display">5</span></label>
          <input type="range" id="cols-input" min="2" max="8" value="5" step="1" />
        </div>
      </div>

      <button type="submit" class="button-primary">Spiel starten</button>
    </form>
  </section>

  <section id="view-game" class="view hidden">
    <button id="back-button" class="button-secondary" type="button">&larr; Zurück</button>

    <div class="turn-row">
      <div id="turn-indicator-left" class="turn-slot"></div>
      <div id="turn-indicator-right" class="turn-slot"></div>
    </div>

    <div id="chomp-board" class="chomp-board"></div>
  </section>

</main>

<script src="js/config.js"></script>
<script src="../../shared/js/assets.js"></script>
<script src="js/game.js"></script>
<script src="js/render.js"></script>
<script src="js/main.js"></script>
</body>
</html>
